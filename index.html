async function enablePush(){
  if(!(await isSupported())||!('Notification' in window))throw new Error('This browser cannot receive push alerts. On iPhone, add the app to your Home Screen first (Share > Add to Home Screen).')
  if(VAPID_KEY.startsWith('PASTE'))throw new Error('Background alerts are not set up yet (VAPID key missing).')
  if(await Notification.requestPermission()!=='granted')throw new Error('Notifications are blocked. Allow them in your browser or phone settings, then try again.')
  const reg=await navigator.serviceWorker.register('/firebase-messaging-sw.js');await navigator.serviceWorker.ready
  const t=await getToken(getMessaging(fbApp),{vapidKey:VAPID_KEY,serviceWorkerRegistration:reg})
  if(!t)throw new Error('Could not get a push token. Try again.')
  return t
}

/* ---------- Auth ---------- */
function Auth(){
  const [mode,setMode]=useState('in'),[email,setEmail]=useState(''),[pw,setPw]=useState(''),[busy,err,run]=useAct()
  const google=()=>run(async()=>{const p=new GoogleAuthProvider();try{await signInWithPopup(auth,p)}catch(e){if(['auth/popup-blocked','auth/operation-not-supported-in-this-environment'].includes(e.code))return signInWithRedirect(auth,p);throw e}})
  const submit=e=>{e.preventDefault();run(()=>(mode==='in'?signInWithEmailAndPassword:createUserWithEmailAndPassword)(auth,email,pw))}
  return <main className="min-h-screen grid place-items-center p-5"><form onSubmit={submit} className="w-full max-w-sm bg-white/70 rounded-3xl shadow-soft p-7">

    <Err m={err}/>
    <button disabled={busy} className="w-full mt-4 rounded-2xl bg-sagedk text-cream py-3 font-semibold disabled:opacity-60">{busy?'Please wait…':mode==='in'?'Sign in':'Create account'}</button>
    <div className="flex items-center gap-3 my-4 text-xs text-ink/40"><span className="flex-1 h-px bg-sage/30"/>or<span className="flex-1 h-px bg-sage/30"/></div>

    <button type="button" onClick={()=>setMode(mode==='in'?'up':'in')} className="w-full mt-3 text-sm text-lavdk">{mode==='in'?'New here? Create an account':'Have an account? Sign in'}</button>
  </form></main>
}

/* ---------- Ring sounds ---------- */
const SOUNDS={Chime:[880,1175,1568],Bell:[659,523],Lullaby:[523,659,784,659]}
function useRinger(){
  const ctx=useRef(),timer=useRef(),gain=useRef()
  const stop=()=>clearInterval(timer.current)
  const start=(name,vol)=>{stop();ctx.current??=new (window.AudioContext||window.webkitAudioContext)();const c=ctx.current;c.resume();gain.current=c.createGain();gain.current.gain.value=vol;gain.current.connect(c.destination);let i=0
    const tick=()=>{const o=c.createOscillator(),g=c.createGain(),f=SOUNDS[name];o.frequency.value=f[i++%f.length];g.gain.setValueAtTime(.0001,c.currentTime);g.gain.exponentialRampToValueAtTime(1,c.currentTime+.03);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+.55);o.connect(g);g.connect(gain.current);o.start();o.stop(c.currentTime+.6)};tick();timer.current=setInterval(tick,650)}
  const setVol=v=>{if(gain.current)gain.current.gain.value=v}
  useEffect(()=>stop,[])
  return {start,stop,setVol,state:()=>ctx.current?.state}
}

function PushCard({uid}){
  const [on,setOn]=useState(typeof Notification!=='undefined'&&Notification.permission==='granted'&&localStorage.pushOn==='1'),[busy,err,run]=useAct()
  const enable=()=>run(async()=>{const t=await enablePush();await setDoc(doc(db,'users',uid),{fcmTokens:arrayUnion(t)},{merge:true});localStorage.pushOn='1';setOn(true)})
  return <div className="bg-white/80 rounded-[2rem] p-5 shadow-pop"><h3 className="font-cute text-lg">Ring me when the app is closed</h3><p className="text-sm text-ink/60 mb-3">Rings arrive as a loud, persistent notification with vibration. The sound is your phone's notification sound.</p>
    {on?<p className="font-cute text-sagedk">On for this device ✓</p>:<button disabled={busy} onClick={enable} className="w-full rounded-full bg-lavdk text-white py-2.5 font-cute disabled:opacity-60">{busy?'Setting up…':'Turn on ring alerts'}</button>}<Err m={err}/></div>
}
function Ring({rid,uid}){
  const [sound,setSound]=useState('Chime'),[rings,setRings]=useState([]),[busy,err,run]=useAct()
  const [vol,setVol]=useState(+(localStorage.ringVol??.6)),[muted,setMuted]=useState(localStorage.ringMute==='1')
  const ringer=useRinger(),[seen,setSeen]=useState(null),[needTap,setNeedTap]=useState(false)
  useEffect(()=>onSnapshot(query(collection(db,'rooms',rid,'rings'),orderBy('createdAt','desc'),limit(5)),s=>setRings(s.docs.map(d=>({id:d.id,...d.data()}))),()=>{}),[rid])
  const incoming=rings.find(r=>r.from!==uid&&r.status==='pending'&&r.createdAt&&Date.now()-r.createdAt.toMillis()<120000)
  const level=muted?0:vol
  useEffect(()=>{localStorage.ringVol=vol;localStorage.ringMute=muted?'1':'0';ringer.setVol(level)},[vol,muted])
  useEffect(()=>{if(incoming&&incoming.id!==seen){setSeen(incoming.id);try{ringer.start(incoming.sound,level)}catch{}setTimeout(()=>setNeedTap(ringer.state()!=='running'),200)}if(!incoming)ringer.stop()},[incoming?.id])
  const answer=st=>{ringer.stop();run(()=>updateDoc(doc(db,'rooms',rid,'rings',incoming.id),{status:st}))}
  const mine=rings.find(r=>r.from===uid)
  return <div className="space-y-4">
    <div className="bg-white/80 rounded-[2rem] p-6 shadow-pop text-center"><Plush wig/><h3 className="font-cute text-xl mt-2">Ring your person</h3><p className="text-sm text-ink/60 mb-3">They choose whether to answer. It rings only while their app is open.</p>
      <select value={sound} onChange={e=>setSound(e.target.value)} className="rounded-full border border-pink bg-cream px-4 py-2 font-cute">{Object.keys(SOUNDS).map(s=><option key={s}>{s}</option>)}</select>
      <button disabled={busy} onClick={()=>run(()=>addDoc(collection(db,'rooms',rid,'rings'),{from:uid,sound,status:'pending',createdAt:serverTimestamp()}))} className="block w-full mt-3 rounded-full bg-pinkdk text-white py-3 font-cute text-lg disabled:opacity-60">{busy?'Ringing…':'Send ring'}</button>
      {mine&&<p className="mt-3 text-sm font-cute text-lavdk">Last ring: {mine.status==='pending'?'waiting…':mine.status}</p>}<Err m={err}/></div>
    <PushCard uid={uid}/>
    <div className="bg-white/80 rounded-[2rem] p-5 shadow-pop"><h3 className="font-cute text-lg mb-2">Your ringtone volume</h3><div className="flex items-center gap-3"><button onClick={()=>setMuted(!muted)} className="font-cute rounded-full bg-lav/40 px-4 py-1.5">{muted?'Unmute':'Mute'}</button><input aria-label="Volume" type="range" min="0" max="1" step=".05" value={vol} onChange={e=>setVol(+e.target.value)} className="flex-1 accent-[#D9608F]"/></div></div>
    {incoming&&<div role="alertdialog" className="fixed inset-0 z-20 grid place-items-center bg-ink/40 p-5"><div className="bg-cream rounded-[2.5rem] p-8 text-center shadow-pop max-w-xs w-full"><Plush s={120} wig/><h3 className="font-cute text-2xl text-pinkdk">Ring ring!</h3><p className="font-cute text-ink/60">Your person is thinking of you</p>
      {needTap&&<button onClick={()=>{ringer.start(incoming.sound,level);setNeedTap(false)}} className="mt-3 rounded-full bg-lav px-4 py-2 font-cute">Tap to hear it</button>}
      <div className="flex gap-2 mt-4"><button onClick={()=>setMuted(!muted)} className="flex-1 rounded-full bg-lav/40 py-2 font-cute">{muted?'Unmute':'Mute'}</button><button onClick={()=>answer('answered')} className="flex-1 rounded-full bg-pinkdk text-white py-2 font-cute">Answer</button></div>
      <button onClick={()=>answer('dismissed')} className="mt-2 w-full rounded-full border border-pinkdk/40 py-2 font-cute text-pinkdk">Dismiss</button></div></div>}
  </div>
}

/* ---------- Share (wallpapers + audio/video) ---------- */
function Share({rid,uid}){
  const [items,setItems]=useState([]),[kind,setKind]=useState('wallpaper'),[pct,setPct]=useState(null),[busy,err,run]=useAct()
  useEffect(()=>onSnapshot(query(collection(db,'rooms',rid,'shares'),orderBy('createdAt','desc'),limit(20)),s=>setItems(s.docs.map(d=>({id:d.id,...d.data()}))),()=>{}),[rid])
  const upload=f=>run(async()=>{
    if(f.size>50*1024*1024)throw new Error('File is over 50 MB.')
    const r=ref(storage,`rooms/${rid}/${uid}/${Date.now()}-${f.name.replace(/[^\w.-]/g,'_')}`)
    const t=uploadBytesResumable(r,f,{contentType:f.type});setPct(0)
    await new Promise((ok,no)=>t.on('state_changed',s=>setPct(Math.round(s.bytesTransferred/s.totalBytes*100)),no,ok))
    await addDoc(collection(db,'rooms',rid,'shares'),{from:uid,kind,name:f.name,type:f.type,url:await getDownloadURL(r),status:'pending',createdAt:serverTimestamp()});setPct(null)
  }).finally?.(()=>setPct(null))
  const set=(id,status)=>run(()=>updateDoc(doc(db,'rooms',rid,'shares',id),{status}))
  const save=async s=>{try{const b=await (await fetch(s.url)).blob(),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=s.name;a.click()}catch{window.open(s.url,'_blank')}}
  return <div className="space-y-4"><div className="bg-white/80 rounded-[2rem] p-5 shadow-pop"><div className="flex gap-2 mb-3">{['wallpaper','media'].map(k=><button key={k} onClick={()=>setKind(k)} className={`flex-1 rounded-full py-2 font-cute ${kind===k?'bg-pinkdk text-white':'bg-lav/40'}`}>{k==='wallpaper'?'Wallpaper':'Audio / video'}</button>)}</div>
    <label className="block rounded-3xl border-2 border-dashed border-pink p-6 text-center font-cute cursor-pointer">{busy?`Uploading ${pct??0}%…`:'Choose a file to send'}<input type="file" hidden disabled={busy} accept={kind==='wallpaper'?'image/*':'audio/*,video/*'} onChange={e=>e.target.files[0]&&upload(e.target.files[0])}/></label><Err m={err}/></div>
    {items.length===0&&<p className="text-center font-cute text-ink/50">Nothing shared yet.</p>}
    {items.map(s=>{const mineS=s.from===uid;return <article key={s.id} className="bg-white/80 rounded-[2rem] p-4 shadow-pop">
      <p className="font-cute text-sm text-lavdk mb-2">{mineS?'You sent':'Sent to you'} · {s.name} · {s.status}</p>
      {s.kind==='wallpaper'?(mineS||s.status!=='pending'?<img src={s.url} alt={s.name} className="rounded-2xl w-full max-h-96 object-cover"/>:<p className="font-cute text-sm">A wallpaper is waiting. Preview it?</p>)
        :(s.status==='accepted'||mineS?(s.type.startsWith('video')?<video controls src={s.url} className="rounded-2xl w-full"/>:<audio controls src={s.url} className="w-full"/>):<p className="font-cute text-sm">They'd like to play this with you.</p>)}
      {!mineS&&s.status==='pending'&&<div className="flex gap-2 mt-3"><button onClick={()=>set(s.id,'accepted')} className="flex-1 rounded-full bg-pinkdk text-white py-2 font-cute">{s.kind==='wallpaper'?'Preview':'Play'}</button><button onClick={()=>set(s.id,'declined')} className="flex-1 rounded-full bg-lav/40 py-2 font-cute">Decline</button></div>}
      {!mineS&&s.kind==='wallpaper'&&s.status==='accepted'&&<button onClick={()=>save(s)} className="mt-3 w-full rounded-full bg-sagedk text-white py-2 font-cute">Save to device</button>}</article>})}</div>
}

/* ---------- Tic-tac-toe ---------- */
const LINES=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]]
function Play({rid,uid,partner}){
  const [g,setG]=useState(undefined),[busy,err,run]=useAct(),gref=doc(db,'rooms',rid,'games','ttt')
  useEffect(()=>onSnapshot(gref,s=>setG(s.exists()?s.data():null),e=>setG(null)),[rid])
  const fresh=()=>run(()=>setDoc(gref,{board:'.........',x:uid,o:partner,turn:uid,winner:''}))
  const move=i=>{if(g.turn!==uid||g.board[i]!=='.'||g.winner)return;const mark=g.x===uid?'X':'O',b=g.board.slice(0,i)+mark+g.board.slice(i+1)
    const w=LINES.some(l=>l.every(k=>b[k]===mark))?uid:b.includes('.')?'':'draw';run(()=>updateDoc(gref,{board:b,turn:g.turn===g.x?g.o:g.x,winner:w}))}
  if(g===undefined)return <p className="text-center font-cute">Loading…</p>
  return <div className="bg-white/80 rounded-[2rem] p-6 shadow-pop text-center"><h3 className="font-cute text-xl mb-1">Tic-Tac-Toe</h3>
    {!g?<><p className="text-sm text-ink/60 mb-3">Start a game. Both of you see moves live.</p><button onClick={fresh} disabled={busy} className="rounded-full bg-pinkdk text-white px-6 py-3 font-cute">Start game</button></>:<>
      <p className="font-cute text-lavdk mb-3">{g.winner?(g.winner==='draw'?'A cozy draw!':g.winner===uid?'You won! 🎉':'They won this one'):g.turn===uid?'Your turn':'Their turn…'} (you are {g.x===uid?'X':'O'})</p>
      <div className="grid grid-cols-3 gap-2 max-w-[260px] mx-auto">{[...g.board].map((c,i)=><button key={i} aria-label={`Cell ${i+1} ${c==='.'?'empty':c}`} onClick={()=>move(i)} className={`aspect-square rounded-2xl text-3xl font-cute ${c==='X'?'bg-pink text-pinkdk':c==='O'?'bg-lav/60 text-lavdk':'bg-cream'}`}>{c==='.'?'':c}</button>)}</div>
      <button onClick={fresh} className="mt-4 rounded-full bg-lav/40 px-5 py-2 font-cute">New game</button></>}
    <Err m={err}/><p className="mt-4 text-xs text-ink/40">Couple quizzes are not built yet.</p></div>
}

/* ---------- Corner ---------- */
function Corner({user,room,roomId,back}){
  const [tab,setTab]=useState('ring'),[code,setCode]=useState((new URLSearchParams(location.search).get('code')||'').toUpperCase()),[busy,err,run]=useAct()
  const create=()=>run(async()=>{for(let n=0;n<5;n++){const id=genCode();const ok=await runTransaction(db,async t=>{const r=doc(db,'rooms',id);if((await t.get(r)).exists())return false;t.set(r,{members:[user.uid],createdAt:serverTimestamp()});t.set(doc(db,'users',user.uid),{roomId:id},{merge:true});return true});if(ok)return}throw new Error('Could not create a room. Try again.')})
  const join=e=>{e.preventDefault();run(()=>runTransaction(db,async t=>{const r=doc(db,'rooms',code.trim()),s=await t.get(r);if(!s.exists())throw new Error('No room with that code.');const m=s.data().members;if(!m.includes(user.uid)){if(m.length>=2)throw new Error('That room already has two people.');t.update(r,{members:[...m,user.uid]})}t.set(doc(db,'users',user.uid),{roomId:code.trim()},{merge:true})}))}
  const link=`${location.origin}/?code=${roomId}`
  const shell=c=><main className="min-h-screen font-cute bg-gradient-to-b from-[#FFE7EF] via-cream to-[#ECE4F7]"><div className="max-w-xl mx-auto p-5 pb-12"><button onClick={back} className="rounded-full bg-white/70 px-4 py-1.5 mb-3">← Library</button><h1 className="text-3xl text-pinkdk text-center">My Little Corner</h1>{c}</div></main>
  if(!roomId)return shell(<div className="mt-6 space-y-4"><div className="text-center"><Plush s={110}/></div>
    <div className="bg-white/80 rounded-[2rem] p-6 shadow-pop"><h2 className="text-xl">Start a corner</h2><p className="text-sm text-ink/60 mb-3">You get a code to share with one person.</p><button disabled={busy} onClick={create} className="w-full rounded-full bg-pinkdk text-white py-3 disabled:opacity-60">{busy?'Creating…':'Create our room'}</button></div>
    <form onSubmit={join} className="bg-white/80 rounded-[2rem] p-6 shadow-pop"><h2 className="text-xl">Have a code?</h2><input value={code} onChange={e=>setCode(e.target.value.toUpperCase())} maxLength={6} placeholder="ABC123" className="w-full mt-2 rounded-full bg-cream border border-lav px-5 py-3 tracking-widest text-center"/><button disabled={busy||code.length<6} className="w-full mt-3 rounded-full bg-lavdk text-white py-3 disabled:opacity-60">Join</button></form><Err m={err}/></div>)
  if(!room)return shell(<p className="text-center mt-10">Opening your corner…</p>)
  if(room.members.length<2)return shell(<div className="mt-6 bg-white/80 rounded-[2rem] p-6 shadow-pop text-center"><Plush s={110}/><h2 className="text-xl">Waiting for your person</h2><p className="text-sm text-ink/60">Share this code or link. It works once; the room holds exactly two.</p><div className="my-3 text-4xl tracking-[.3em] text-lavdk">{roomId}</div>
    <button onClick={()=>navigator.clipboard?.writeText(link)} className="rounded-full bg-lav/40 px-5 py-2">Copy invite link</button></div>)
  const partner=room.members.find(m=>m!==user.uid)
  return shell(<><nav className="flex gap-2 my-4">{[['ring','Ring'],['share','Share'],['play','Play']].map(([k,l])=><button key={k} onClick={()=>setTab(k)} className={`flex-1 rounded-full py-2.5 transition ${tab===k?'bg-pinkdk text-white scale-105 shadow-pop':'bg-white/70'}`}>{l}</button>)}</nav>
    {tab==='ring'&&<Ring rid={roomId} uid={user.uid}/>}{tab==='share'&&<Share rid={roomId} uid={user.uid}/>}{tab==='play'&&<Play rid={roomId} uid={user.uid} partner={partner}/>}</>)
}

/* ---------- App ---------- */
function App(){
  const [user,setUser]=useState(undefined),[profile,setProfile]=useState({}),[room,setRoom]=useState(null),[view,setView]=useState(new URLSearchParams(location.search).get('code')||new URLSearchParams(location.search).get('corner')?'corner':'home')
  useEffect(()=>onAuthStateChanged(auth,setUser),[])
  useEffect(()=>{if(!user)return;return onSnapshot(doc(db,'users',user.uid),s=>setProfile(s.data()||{}),()=>{})},[user?.uid])
  useEffect(()=>{setRoom(null);if(!profile.roomId)return;return onSnapshot(doc(db,'rooms',profile.roomId),s=>setRoom(s.data()||null),()=>{})},[profile.roomId])
  if(!configured)return <main className="p-6 max-w-md mx-auto"><h1 className="font-serif text-2xl">Setup needed</h1><p className="mt-2">Open <code>index.html</code> and paste your Firebase keys in the <code>FIREBASE_CONFIG</code> block near the bottom, then upload it again.</p></main>
  if(user===undefined)return <main className="min-h-screen grid place-items-center"><Book s={64}/></main>
  if(!user)return <Auth/>
  return view==='corner'?<Corner user={user} room={room} roomId={profile.roomId} back={()=>setView('home')}/>:<Home user={user} tasks={profile.tasks||[]} open={()=>setView('corner')}/>
}

function InstallPrompt(){
  const [ev,setEv]=useState(null),[show,setShow]=useState(false),[ios,setIos]=useState(false)
  useEffect(()=>{
    const installed=matchMedia('(display-mode: standalone)').matches||navigator.standalone
    const snoozed=+localStorage.installSnooze>Date.now()
    if(installed||snoozed)return
    const take=()=>{if(window.__ip){setEv(window.__ip);setTimeout(()=>setShow(true),1500)}}
    take();addEventListener('ip-ready',take)
    const done=()=>setShow(false);addEventListener('appinstalled',done)
    if(/iphone|ipad|ipod/i.test(navigator.userAgent)){setIos(true);setTimeout(()=>setShow(true),2500)}
    return()=>{removeEventListener('ip-ready',take);removeEventListener('appinstalled',done)}
  },[])
  const later=()=>{localStorage.installSnooze=Date.now()+6048e5;setShow(false)}
  const install=async()=>{if(!ev)return;ev.prompt();const r=await ev.userChoice;window.__ip=null;setEv(null);setShow(false);if(r.outcome!=='accepted')later()}
  if(!show||(!ev&&!ios))return null
  return <div role="dialog" aria-label="Install Little Library" className="fixed inset-x-0 bottom-0 z-50 p-4 flex justify-center pointer-events-none"><div className="rise pointer-events-auto relative w-full max-w-sm rounded-[2rem] bg-gradient-to-br from-[#FFE7EF] via-cream to-[#ECE4F7] border-2 border-white shadow-[0_10px_40px_-8px_rgba(217,96,143,.5)] p-5 pt-6 text-center font-cute">
    <div className="absolute -top-10 left-1/2 -translate-x-1/2"><Plush s={72}/></div>
    <button onClick={later} aria-label="Close" className="absolute top-3 right-4 text-ink/40 text-lg">✕</button>
    <h3 className="text-xl text-pinkdk mt-5">Keep us on your home screen?</h3>
    <p className="text-sm text-ink/60 mt-1">Install Little Library like an app. It opens full screen with no browser bar.</p>
    {ev?<button onClick={install} className="mt-4 w-full rounded-full bg-pinkdk text-white py-3 text-lg shadow-pop active:translate-y-1 transition">Install app</button>
      :<p className="mt-4 rounded-2xl bg-white/70 p-3 text-sm text-ink/70">Tap <b>Share</b> (the square with an arrow) at the bottom of Safari, then choose <b>Add to Home Screen</b>.</p>}
    <button onClick={later} className="mt-2 text-sm text-lavdk">Maybe later</button></div></div>
}

createRoot(document.getElementById('root')).render(<><App/><InstallPrompt/></>)

</script></body></html>
